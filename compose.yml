version: '3.8'

services:
  web:
    build: .
    container_name: taskmanager_web
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: taskmanager_db_container
    restart: always
    environment:
      MYSQL_DATABASE: task_manager_db
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: